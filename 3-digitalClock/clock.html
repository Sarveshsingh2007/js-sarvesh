<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
</head>
<style>
    body {
        background-color: #2F4F4F;  
        color: #fff;
        font-family: "Open Sans", sans-serif;
    }
    .center{
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    #banner{
        font-size: 15px;
        font-weight: 500;
        color: #00001A;
        font-weight: 700;
    }
    #clock{
        font-size: 40px;
        background-color: #42FFC3;
        padding: 10px 50px;
        margin-top: 10px;
        border-radius: 10px;
        font-size: 15px;
        color:#111;
        font-weight: 700;
    }
</style>
<body><div class="center">
    <div id="banner"><span>Your Local Time</span></div>
    <div id="clock"></div>
</div>
<script src="clock.js"></script>
</body>
</html>
