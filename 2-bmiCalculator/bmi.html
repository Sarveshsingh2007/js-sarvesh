<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bmi.css">
    <title>Bmi Calculator</title>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p><label>Height:</label><input type="text" placeholder="Height in Cm" id="height"></p>
            <p><label>Weight:</label><input type="text" placeholder="Weight in Kg" id="weight"></p>
            <button>Calculate</button>
            <div id="results"></div>
            <div id="weight-guide">
                <h3>BMI Guide</h3>
                <p>Under Range = Less than 18.6</p>
                <p>Normal Range = 18.6 and 24.9</p>
                <p>Over Range = Greater than 24.9</p>
            </div>
        </form>
    </div>
</body>
<script src="bmi.js"></script>
</html>
